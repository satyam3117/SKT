spring.application.name=ORDER-SERVICE
spring.datasource.url=jdbc:mysql://localhost:3317/order_service
spring.datasource.username=root
spring.datasource.password=root

# TIP: Since you use Flyway, change 'update' to 'validate' or 'none'
# to prevent Hibernate and Flyway from fighting over database schema controls.
spring.jpa.hibernate.ddl-auto=validate

server.port=8081
inventory.url=http://INVENTORY-SERVICE
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# --- LOGGING CHANGES (CRITICAL FOR DEBUGGING) ---
# Temporarily set this to INFO so you can actually watch what happens after Hibernate
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
logging.level.org.apache.kafka=INFO
logging.level.io.confluent=INFO
logging.level.com.skt.order_service.service=DEBUG
logging.file.name=logs/app.log

# --- RESILIENCE4J PROPERTIES ---
resilience4j.circuitbreaker.instances.inventory.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.inventory.event-consumer-buffer-size=10
resilience4j.circuitbreaker.instances.inventory.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.inventory.slidingWindowSize=10
resilience4j.circuitbreaker.instances.inventory.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventory.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.inventory.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.inventory.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.inventory.minimum-number-of-calls=5
resilience4j.timelimiter.instances.inventory.timeout-duration=3s
resilience4j.retry.instances.inventory.max-attempts=3
resilience4j.retry.instances.inventory.wait-duration=5s

# --- EUREKA (TYPO FIXED) ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# IF YOU ARE NOT RUNNING EUREKA LOCALLY YET, UNCOMMENT THE LINE BELOW TO BYPASS IT:
# eureka.client.enabled=false

# --- KAFKA PROPERTIES (UPDATED FOR DOCKER NETWORK) ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.template.default-topic=order-placed
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=http://127.0.0.1:8085