spring.application.name=NOTIFICATION-SERVICE
server.port=8083

# Mail (Mailtrap)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=328a05ddd77a2f
spring.mail.password=a33b853550a3d3

# Kafka Consumer Setup
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notificationService

# Key & Value Deserializers
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=http://127.0.0.1:8085
spring.kafka.consumer.properties.specific.avro.reader=true

# JSON Deserialization Settings
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.skt.notification_service.order.event.OrderPlacedEvent

# --- LOGGING CONFIGURATION ---
logging.file.name=../logs/notification-service.log
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.apache.kafka=INFO
logging.level.io.confluent=INFO
logging.level.com.skt.notification_service=INFO

# Log Pattern with Trace ID & Span ID
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36}.%M:%L - %msg%n
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# --- OBSERVABILITY (METRICS & PROMETHEUS) ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=NOTIFICATION-SERVICE

# --- DISTRIBUTED TRACING (TEMPO / ZIPKIN) ---
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans