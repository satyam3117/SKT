springdoc.swagger-ui.urls[1].name= Order Service
springdoc.swagger-ui.urls[1].url=/apggregate/order-service/v3/api-docs
springdoc.swagger-ui.urls[2].name= Inventory Service
springdoc.swagger-ui.urls[2].url=/apggregate/inventory-service/v3/api-docs
