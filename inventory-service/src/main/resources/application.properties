spring.application.name=INVENTORY-SERVICE
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3316/inventory_service
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=none
server.port=8082
springdoc.api-docs.enabled=true

# --- EUREKA ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# --- LOGGING CONFIGURATION ---
logging.file.name=../logs/inventory-service.log

# Log Levels (Adjusted root to INFO so web/actuator events are visible)
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
logging.level.com.skt.inventory_service.service=DEBUG

# Log Pattern with Trace ID & Span ID
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36}.%M:%L - %msg%n
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# --- OBSERVABILITY (METRICS & PROMETHEUS) ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=INVENTORY-SERVICE

# --- DISTRIBUTED TRACING (TEMPO / ZIPKIN) ---
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans