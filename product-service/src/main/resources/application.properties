spring.application.name=PRODUCT-SERVICE
spring.data.mongodb.uri=mongodb://localhost:27017/product-service
server.port=8080
springdoc.api-docs.enabled=true

eureka.client.service-url.deafaultZone=http://localhost:8761/eureka
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO


# Creates 'app.log' inside a local 'logs' directory
logging.file.name=logs/app.log

# Change the global logging level
logging.level.root=WARN
logging.level.com.skt.product_service.service=DEBUG

# REDIS
spring.cache.type=redis

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Optional tuning
spring.cache.redis.time-to-live=600s
spring.cache.redis.cache-null-values=false

logging.level.org.springframework.cache=DEBUG