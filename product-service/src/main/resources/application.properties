# =========================================================
# APPLICATION
# =========================================================

spring.application.name=product-service
server.port=8080
spring.profiles.active=dev

# =========================================================
# MONGODB
# =========================================================

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/product-service}


# =========================================================
# API DOCUMENTATION
# =========================================================

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true


# =========================================================
# SECURITY - DEV
# =========================================================

# Basic Auth credentials for local development.
# DO NOT commit the actual password to Git.
#
# Windows PowerShell:
# $env:PRODUCT_ADMIN_PASSWORD="your-password"
#
# Windows CMD:
# set PRODUCT_ADMIN_PASSWORD=your-password

app.security.username=${PRODUCT_ADMIN_USERNAME:admin}
app.security.password=${PRODUCT_ADMIN_PASSWORD}


# =========================================================
# SERVICE DISCOVERY
# =========================================================

eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

# Eureka instance identity
eureka.instance.appname=${spring.application.name}
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Local development
eureka.instance.prefer-ip-address=true

# Eureka heartbeat
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Health
eureka.client.healthcheck.enabled=true


# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
logging.level.root=INFO
logging.level.com.skt.product_service=INFO

logging.file.name=../logs/product-service.log

logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36}.%M:%L - %msg%n

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]


# Redis/cache debugging
logging.level.org.springframework.cache=TRACE
logging.level.org.springframework.data.redis.cache=DEBUG


# =========================================================
# MANAGEMENT / ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.tracing.enabled=false

management.tracing.sampling.probability=1.0

management.metrics.distribution.percentiles-histogram.http.server.requests=true

management.observations.key-values.application=PRODUCT-SERVICE


# =========================================================
# KAFKA
# =========================================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.template.default-topic=product-created-topic

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

spring.kafka.producer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://127.0.0.1:8085}

spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.request.timeout.ms=30000

# =========================================================
# PRODUCT IMAGE LIMITS
# =========================================================

app.product.images.max-count=8
app.product.images.max-size-bytes=5242880


logging.level.org.springframework.boot.context.config=DEBUG

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8181/realms/spring-microservices-security-realm