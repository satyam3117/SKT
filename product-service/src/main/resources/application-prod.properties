# =========================================================
# APPLICATION
# =========================================================

spring.application.name=PRODUCT-SERVICE
server.port=8080


# =========================================================
# MONGODB
# =========================================================

# Set MONGODB_URI in the production environment.
spring.data.mongodb.uri=${MONGODB_URI}


# =========================================================
# API DOCUMENTATION
# =========================================================

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true


# =========================================================
# SECURITY - PRODUCTION
# =========================================================

# Keycloak / OAuth2 Resource Server
#
# Example:
# KEYCLOAK_ISSUER_URI=https://your-keycloak-host/realms/your-realm

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}


# =========================================================
# SERVICE DISCOVERY
# =========================================================

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}


# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
logging.level.root=INFO
logging.level.com.skt.product_service=INFO

logging.file.name=../logs/product-service.log

logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36}.%M:%L - %msg%n

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]


# =========================================================
# Redis/cache logging
# =========================================================

logging.level.org.springframework.cache=INFO
logging.level.org.springframework.data.redis.cache=INFO


# =========================================================
# MANAGEMENT / ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.tracing.enabled=false

management.tracing.sampling.probability=1.0

management.metrics.distribution.percentiles-histogram.http.server.requests=true

management.observations.key-values.application=PRODUCT-SERVICE


# =========================================================
# KAFKA
# =========================================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

spring.kafka.template.default-topic=product-created-topic

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

spring.kafka.producer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL}